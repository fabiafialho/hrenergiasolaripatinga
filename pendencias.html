<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de pendências</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202735;font:15px/1.5 system-ui,sans-serif}main{max-width:900px;margin:48px auto;padding:0 20px}h1{font-size:30px;letter-spacing:-1px;margin:0}p{color:#687386;margin:6px 0 22px}.top,.item{background:white;border:1px solid #e1e5eb;border-radius:14px;padding:22px;margin:16px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>strong{flex:1}label{font-size:13px;font-weight:600;color:#526074;display:block;margin:14px 0 5px}input[type=text],textarea{width:100%;border:1px solid #dce1e8;border-radius:8px;padding:12px;font:inherit;background:#fcfdfe;color:#202735}textarea{min-height:90px;resize:vertical}input[type=checkbox]{width:22px;height:22px;accent-color:#16805b;cursor:pointer}button{font:inherit;font-weight:600;border:1px solid #dce1e8;background:white;color:#344054;padding:10px 15px;border-radius:8px;cursor:pointer}button.primary{background:#25364d;color:white;border-color:#25364d}button.del{color:#a33;border:0;padding:6px;background:transparent}.done{border-color:#9bd8c0}.done .status{color:#16805b}.status{font-size:12px;color:#697586}.bar{height:8px;background:#e8edf2;border-radius:8px;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:#16805b;transition:width .2s}.small{font-size:12px;color:#687386}.meta{display:grid;grid-template-columns:1fr 1fr;gap:15px}.actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}@media(max-width:550px){main{margin:22px auto}.meta{grid-template-columns:1fr}.top,.item{padding:16px}}@media print{body{background:white}main{margin:0;max-width:none}.actions,.del,.small{display:none}.item{break-inside:avoid}textarea{border:0;resize:none}input{border:0!important}}.attachments{margin:8px 0 16px}.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.thumb{position:relative;width:125px}.thumb img{width:125px;height:95px;object-fit:cover;border-radius:8px;cursor:zoom-in}.thumb button{position:absolute;right:3px;top:3px;padding:2px 7px;background:white}.attach{font-size:13px}dialog{border:0;border-radius:12px;padding:12px;max-width:95vw;max-height:95vh}dialog img{display:block;max-width:88vw;max-height:80vh;object-fit:contain}dialog::backdrop{background:#000b}@media print{.attach,.thumb button{display:none}} </style></head><body><main><h1>Controle de pendências</h1><p>Organize as solicitações, acompanhe as respostas e marque o que foi resolvido.</p><section class="top"><div class="meta"><div><label for="project">Projeto / Empresa</label><input id="project" type="text" placeholder="Nome do projeto"></div><div><label for="person">Responsável</label><input id="person" type="text" placeholder="Nome da pessoa"></div></div><div class="row" style="margin-top:20px"><strong id="count"></strong><span id="percent" class="status"></span></div><div class="bar"><div id="progress"></div></div><span class="small" id="saved">Salvamento automático neste navegador.</span></section><div id="items"></div><div class="actions"><button class="primary" id="add">+ Adicionar pendência</button><button id="import">Importar cópia anterior</button><input id="importFile" type="file" accept=".html" hidden><button id="export">Baixar cópia preenchida</button><button onclick="window.print()">Imprimir / PDF</button></div><p class="small">Para enviar a outra pessoa, baixe uma cópia preenchida e compartilhe o arquivo HTML. As alterações não são sincronizadas entre dispositivos.</p></main><dialog id="viewer"><button onclick="this.parentElement.close()">Fechar ×</button><img alt="Imagem ampliada"></dialog><script id="initial" type="application/json">{"project":"","person":"","items":[{"task":"","reply":"","done":false}]}</script><script>
const $=id=>document.getElementById(id);const initial=JSON.parse($('initial').textContent);const key='pendencias-v1-'+location.pathname;let state=initial;try{const raw=localStorage.getItem(key);if(raw)state=JSON.parse(raw)}catch(e){}function attachments(el,x,field){let k=field+'Images';if(!Array.isArray(x[k]))x[k]=[];let area=document.createElement('div');area.className='attachments';area.innerHTML='<div class="thumbs"></div><button type="button" class="attach">+ Anexar imagens</button><input type="file" accept="image/*" multiple hidden><span class="small"> · ou cole um print no campo acima</span>';el.querySelector('.'+field).after(area);let list=area.querySelector('.thumbs'),input=area.querySelector('input');function draw(){list.replaceChildren();x[k].forEach((src,i)=>{let box=document.createElement('div');box.className='thumb';let img=document.createElement('img');img.src=src;img.alt='Imagem '+(i+1);img.onclick=()=>{$('viewer').querySelector('img').src=src;$('viewer').showModal()};let b=document.createElement('button');b.textContent='×';b.title='Excluir imagem';b.onclick=()=>{if(confirm('Excluir esta imagem?')){x[k].splice(i,1);draw();save()}};box.append(img,b);list.append(box)})}async function add(files){for(let f of files){if(!f.type.startsWith('image/'))continue;try{let url=URL.createObjectURL(f);let img=new Image();try{img.src=url;await img.decode();let ratio=Math.min(1,1600/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);x[k].push(c.toDataURL('image/jpeg',.78));}finally{URL.revokeObjectURL(url)}}catch(e){alert('Não foi possível abrir uma imagem.')}}draw();save()}area.querySelector('button').onclick=()=>input.click();input.onchange=()=>{add(Array.from(input.files));input.value=''};el.querySelector('.'+field).addEventListener('paste',e=>{let files=Array.from(e.clipboardData.files);if(files.some(f=>f.type.startsWith('image/'))){e.preventDefault();add(files)}});draw()}
function save(){try{localStorage.setItem(key,JSON.stringify(state));$('saved').textContent='Alterações salvas neste navegador.'}catch(e){$('saved').textContent='Limite de armazenamento atingido ou salvamento indisponível. Baixe uma cópia preenchida agora para não perder alterações.'}stats()}function stats(){let n=state.items.length,d=state.items.filter(x=>x.done).length,p=n?Math.round(d/n*100):0;$('count').textContent=d+' de '+n+' pendências resolvidas';$('percent').textContent=p+'% concluído';$('progress').style.width=p+'%'}function render(){ $('items').replaceChildren();state.items.forEach((x,i)=>{let el=document.createElement('section');el.className='item'+(x.done?' done':'');el.innerHTML='<div class="row"><input type="checkbox" aria-label="Marcar como resolvida"><strong>Pendência '+(i+1)+'</strong><span class="status"></span><button class="del" title="Excluir pendência">Excluir</button></div><label>O que precisa ser resolvido?</label><textarea class="task" placeholder="Descreva a solicitação ou pendência..."></textarea><label>Resposta / Retorno do responsável</label><textarea class="reply" placeholder="Escreva aqui a resposta, atualização ou solução..."></textarea>';let check=el.querySelector('input'),status=el.querySelector('.status');check.checked=x.done;status.textContent=x.done?'Resolvida':'Em aberto';check.onchange=()=>{x.done=check.checked;el.classList.toggle('done',x.done);status.textContent=x.done?'Resolvida':'Em aberto';save()};for(let field of ['task','reply']){let t=el.querySelector('.'+field);t.value=x[field];t.oninput=()=>{x[field]=t.value;save()}}for(let field of ['task','reply'])attachments(el,x,field);el.querySelector('.del').onclick=()=>{if(confirm('Excluir esta pendência?')){state.items.splice(i,1);render();save()}};$('items').append(el)});stats()}
for(let field of ['project','person']){$(field).value=state[field];$(field).oninput=()=>{state[field]=$(field).value;save()}}$('add').onclick=()=>{state.items.push({task:'',reply:'',done:false});render();save();$('items').lastElementChild.querySelector('.task').focus()};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async()=>{try{let f=$('importFile').files[0];if(!f)return;let doc=new DOMParser().parseFromString(await f.text(),'text/html');let data=JSON.parse(doc.querySelector('#initial').textContent);if(!Array.isArray(data.items))throw Error();if(!confirm('Substituir as pendências atuais pelas da cópia selecionada?'))return;state=data;for(let field of ['project','person'])$(field).value=state[field]||'';render();save()}catch(e){alert('Não foi possível importar este arquivo.')}finally{$('importFile').value=''}};$('export').onclick=()=>{let clone=document.documentElement.cloneNode(true);clone.querySelector('#initial').textContent=JSON.stringify(state).replace(/</g,'\\u003c');clone.querySelector('#items').replaceChildren();clone.querySelector('#viewer').removeAttribute('open');clone.querySelector('#viewer img').removeAttribute('src');let blob=new Blob(['<!doctype html>'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pendencias-'+Date.now()+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();</script></body></html>
